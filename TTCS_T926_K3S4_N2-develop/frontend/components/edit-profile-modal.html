<div id="edit-profile-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="edit-profile-title">
    <div class="modal-card" style="max-width: 500px;">
      <div class="modal-header">
        <h3 id="edit-profile-title" class="modal-title">Cập Nhật Hồ Sơ Cá Nhân</h3>
        <button type="button" id="close-edit-profile-modal" class="modal-close" aria-label="Đóng">&times;</button>
      </div>
      <p class="modal-desc">Thay đổi thông tin liên hệ và chức danh hiển thị của bạn trên hệ thống.</p>

      <div class="modal-body">
        <div id="edit-profile-alert" class="alert-box hidden" role="alert">
          <div class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line></svg>
          </div>
          <div class="alert-content">
            <p id="edit-profile-alert-msg" style="margin: 0;"></p>
          </div>
        </div>

        <form id="edit-profile-form">
          <div class="form-group">
            <label for="edit-profile-name-input" class="form-label">Họ và tên <span class="required">*</span></label>
            <input type="text" id="edit-profile-name-input" class="form-input" required />
          </div>

          <div class="form-group">
            <label for="edit-profile-title-input" class="form-label">Chức danh công tác</label>
            <input type="text" id="edit-profile-title-input" class="form-input" />
          </div>

          <div class="form-group">
            <label for="edit-profile-phone-input" class="form-label">Số điện thoại liên hệ</label>
            <input type="tel" id="edit-profile-phone-input" class="form-input" placeholder="0912 345 678" />
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
            <button type="button" id="cancel-edit-profile-btn" class="btn btn-outline btn-sm">Hủy bỏ</button>
            <button type="submit" id="submit-edit-profile-btn" class="btn btn-primary btn-sm">
              <span>Lưu thay đổi</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
