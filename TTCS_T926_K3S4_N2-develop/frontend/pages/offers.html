<div id="offers-view" class="hidden">
          <div class="view-header">
            <div class="view-title-group">
              <div style="display: flex; align-items: center; gap: 8px;">
                <h2>Quản lý Thư Mời Nhận Việc (Offer)</h2>
                <span id="offers-total-badge" class="badge badge-primary font-mono">0 thư mời</span>
              </div>
              <p>Quy trình phê duyệt đãi ngộ, phát hành offer và tiếp nhận nhân sự mới</p>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="open-create-offer-modal-btn" class="btn btn-primary btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span> Lập Đề Xuất Offer</span>
              </button>
            </div>
          </div>

          <!-- Toolbar -->
          <div class="filter-toolbar">
            <div class="toolbar-filters">
              <div style="min-width: 260px; flex: 1;">
                <input type="text" id="offers-search-input" class="form-input" placeholder="Tìm theo ứng viên, vị trí..." />
              </div>
              <div style="width: 180px;">
                <select id="offers-status-filter" class="form-input">
                  <option value="ALL">Tất cả trạng thái</option>
                  <option value="PENDING">Chờ phê duyệt</option>
                  <option value="APPROVED">Đã phê duyệt</option>
                  <option value="SENT">Đã gửi ứng viên</option>
                  <option value="ACCEPTED">Ứng viên đồng ý</option>
                  <option value="REJECTED">Từ chối</option>
                </select>
              </div>
            </div>
            <div>
              <button type="button" id="offers-refresh-btn" class="btn btn-outline btn-sm">
                Lọc / Làm mới
              </button>
            </div>
          </div>

          <!-- Table -->
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mã Offer</th>
                  <th>Ứng viên</th>
                  <th>Vị trí tuyển dụng</th>
                  <th>Mức lương đề xuất</th>
                  <th>Ngày dự kiến nhận việc</th>
                  <th>Trạng thái</th>
                  <th style="text-align: center;">Thao tác</th>
                </tr>
              </thead>
              <tbody id="offers-table-body">
                <!-- Injected by JS -->
              </tbody>
            </table>
          </div>
        </div>
