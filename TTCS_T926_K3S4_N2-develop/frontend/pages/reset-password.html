<div id="reset-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="reset-title" class="modal-title">Đặt lại mật khẩu mới</h3>
        <button type="button" id="close-reset-modal" class="modal-close" aria-label="Đóng">&times;</button>
      </div>
      <p class="modal-desc">Mật khẩu mới tối thiểu 8 ký tự, gồm cả chữ và số.</p>

      <div class="modal-body">
        <div id="reset-alert" class="alert-box hidden" role="alert">
          <div class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          </div>
          <div class="alert-content">
            <p id="reset-alert-msg" style="margin: 0;"></p>
          </div>
        </div>

        <form id="reset-form">
          <input type="hidden" id="reset-token-input" />
          <div class="form-group">
            <label for="reset-new-password" class="form-label">Mật khẩu mới</label>
            <input type="password" id="reset-new-password" class="form-input" placeholder="Tối thiểu 8 ký tự (chữ + số)" required />
          </div>
          <div class="form-group">
            <label for="reset-confirm-password" class="form-label">Xác nhận mật khẩu mới</label>
            <input type="password" id="reset-confirm-password" class="form-input" placeholder="Nhập lại mật khẩu mới" required />
          </div>
          <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-block">
            <span>Xác nhận mật khẩu mới</span>
          </button>
        </form>
      </div>
    </div>
  </div>
