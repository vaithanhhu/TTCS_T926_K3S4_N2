<div id="audit-view" class="hidden">
          <div class="view-header">
            <div class="view-title-group">
              <div style="display: flex; align-items: center; gap: 8px;">
                <h2>Nhật ký Kiểm toán Hệ thống (Audit Logs)</h2>
                <span id="audit-total-badge" class="badge badge-primary font-mono">0 sự kiện</span>
              </div>
              <p>Ghi nhận mọi sự kiện đăng nhập, xác thực, thay đổi trạng thái và an ninh tài khoản</p>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="audit-export-btn" class="btn btn-outline btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>Xuất Nhật Ký (CSV)</span>
              </button>
            </div>
          </div>

          <!-- Filter Toolbar -->
          <div class="panel-card" style="margin-bottom: 16px; padding: 12px 16px;">
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
              <div class="search-input-wrapper" style="flex: 1; min-width: 240px; position: relative;">
                <input type="text" id="audit-search-input" class="form-input" style="padding-left: 36px;" placeholder="Tìm theo email, địa chỉ IP hoặc lý do ghi nhận..." />
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </div>
              <div style="min-width: 200px;">
                <select id="audit-status-filter" class="form-input">
                  <option value="ALL">-- Tất cả kết quả --</option>
                  <option value="SUCCESS">Thành công (SUCCESS)</option>
                  <option value="FAILURE">Thất bại (FAILURE)</option>
                  <option value="LOCKED">Khóa tự động (LOCKED)</option>
                  <option value="ACCOUNT_LOCKED">Khóa thủ công (ACCOUNT_LOCKED)</option>
                  <option value="ACCOUNT_UNLOCKED">Mở khóa (ACCOUNT_UNLOCKED)</option>
                  <option value="LOGOUT">Đăng xuất (LOGOUT)</option>
                </select>
              </div>
              <button type="button" id="audit-refresh-btn" class="btn btn-outline btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                <span>Làm mới</span>
              </button>
            </div>
          </div>

          <!-- Table -->
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 150px;">Thời gian</th>
                  <th>Tài khoản thực hiện</th>
                  <th>Hành động / Sự kiện</th>
                  <th style="width: 110px;">Kết quả</th>
                  <th>Chi tiết ghi nhận</th>
                  <th style="width: 100px;">Địa chỉ IP</th>
                  <th style="text-align: center; width: 110px;">Thao tác</th>
                </tr>
              </thead>
              <tbody id="audit-table-body">
                <!-- Dynamically filled -->
              </tbody>
            </table>
          </div>
        </div>
