<div id="forgot-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="forgot-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="forgot-title" class="modal-title">Khôi phục mật khẩu</h3>
        <button type="button" id="close-forgot-modal" class="modal-close" aria-label="Đóng">&times;</button>
      </div>
      <p class="modal-desc">Nhập email công ty để nhận liên kết đặt lại mật khẩu an toàn.</p>

      <div class="modal-body">
        <div id="forgot-alert" class="alert-box hidden" role="alert">
          <div class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          </div>
          <div class="alert-content">
            <p id="forgot-alert-msg" style="margin: 0;"></p>
          </div>
        </div>

        <form id="forgot-form">
          <div class="form-group">
            <label for="forgot-email" class="form-label">Email tài khoản</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="name@company.com" required />
          </div>
          <button type="submit" id="forgot-submit-btn" class="btn btn-primary btn-block">
            <span>Gửi mã OTP xác thực</span>
          </button>
          <div style="margin-top: 14px; text-align: center; font-size: 0.8rem;">
            <a href="#" id="link-open-reset-modal" style="color: var(--color-primary); text-decoration: underline;">Đã nhận được mã token? Nhập mã tại đây</a>
          </div>
        </form>

        <!-- BƯỚC 2: NHẬP VÀ XÁC THỰC MÃ OTP -->
        <form id="otp-form" class="hidden">
          <p id="otp-notice" style="font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 12px; line-height: 1.5;">
            Nếu email đã đăng ký và tài khoản đang hoạt động, bạn sẽ nhận được mã OTP gồm 6 chữ số. Mã có hiệu lực trong vòng <strong>5 phút</strong>.
          </p>
          <div class="form-group">
            <label for="forgot-otp-input" class="form-label">Mã OTP (6 chữ số) <span class="required">*</span></label>
            <input
              type="text"
              id="forgot-otp-input"
              name="otp"
              class="form-input"
              placeholder="••••••"
              maxlength="6"
              pattern="[0-9]{6}"
              style="text-align: center; font-size: 1.4rem; letter-spacing: 8px; font-weight: 700;"
              required
              autocomplete="one-time-code"
            />
          </div>
          <button type="submit" id="verify-otp-btn" class="btn btn-primary btn-block">
            <span>Xác minh mã OTP</span>
          </button>
          <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;">
            <button type="button" id="back-to-forgot-step1-btn" class="link-btn" style="color: var(--color-text-muted);">← Đổi email khác</button>
            <button type="button" id="resend-otp-btn" class="link-btn" style="color: var(--color-primary); font-weight: 600;">Gửi lại mã OTP</button>
          </div>
        </form>
      </div>
    </div>
  </div>
