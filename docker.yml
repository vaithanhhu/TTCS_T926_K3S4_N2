version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu PostgreSQL cho Hệ thống Tuyển dụng Nội bộ (ATS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats_recruitment}
      POSTGRES_USER: ${POSTGRES_USER:-ats_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats_secret123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ats_user} -d ${POSTGRES_DB:-ats_recruitment}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network

  # ----------------------------------------------------------------------------
  # 2. Adminer: Giao diện Web trực quan quản lý CSDL (Truy cập: http://localhost:8080)
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: ats_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats_network

  # ----------------------------------------------------------------------------
  # 3. Mailpit: SMTP Server Giả lập & Web UI kiểm tra email kích hoạt / reset mật khẩu
  # Web UI: http://localhost:8025  |  SMTP Port: 1025
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: ats_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP Server
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - ats_network

  # ----------------------------------------------------------------------------
  # 4. Frontend: Ứng dụng Giao diện Tuyển dụng ATS (React + TypeScript + Vite)
  # Truy cập: http://localhost:3000
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - ats_network

networks:
  ats_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
