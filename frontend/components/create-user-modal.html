<div id="create-user-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="create-user-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="create-user-title" class="modal-title">Tạo tài khoản nhân viên mới</h3>
        <button type="button" id="close-create-user-modal" class="modal-close" aria-label="Đóng">&times;</button>
      </div>
      <p class="modal-desc">Hệ thống sẽ khởi tạo tài khoản, sinh mật khẩu tạm thời và gửi thông báo kích hoạt.</p>

      <div class="modal-body">
        <div id="create-user-alert" class="alert-box hidden" role="alert">
          <div class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          </div>
          <div class="alert-content">
            <p id="create-user-alert-msg" style="margin: 0;"></p>
          </div>
        </div>

        <form id="create-user-form">
          <div class="form-group">
            <label for="create-user-fullname" class="form-label">Họ và tên nhân sự <span class="required">*</span></label>
            <input type="text" id="create-user-fullname" class="form-input" placeholder="Nguyễn Văn A" required />
          </div>
          <div class="form-group">
            <label for="create-user-email" class="form-label">Email công ty <span class="required">*</span></label>
            <input type="email" id="create-user-email" class="form-input" placeholder="name@company.com" required />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label for="create-user-jobtitle" class="form-label">Chức danh</label>
              <select id="create-user-jobtitle" class="form-input" disabled>
                <option value="">Chọn chức danh</option>
              </select>
            </div>
            <div class="form-group">
              <label for="create-user-department" class="form-label">Phòng ban / Đơn vị</label>
              <select id="create-user-department" class="form-input" disabled>
                <option value="">Chọn phòng ban / đơn vị</option>
              </select>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label for="create-user-phone" class="form-label">Số điện thoại</label>
              <input type="text" id="create-user-phone" class="form-input" placeholder="0901234567" />
            </div>
            <div class="form-group">
              <label for="create-user-role" class="form-label">Vai trò ban đầu <span class="required">*</span></label>
              <select id="create-user-role" class="form-input" required>
                <option value="INTERVIEWER">Người phỏng vấn (INTERVIEWER)</option>
                <option value="RECRUITER">Chuyên viên Tuyển dụng (RECRUITER)</option>
                <option value="HIRING_MGR">Trưởng bộ phận (HIRING_MGR)</option>
                <option value="HR_MANAGER">Trưởng phòng Nhân sự (HR_MANAGER)</option>
                <option value="APPROVER">Cấp Phê duyệt (APPROVER)</option>
                <option value="ADMIN">Quản trị viên (ADMIN)</option>
                <option value="CANDIDATE">Ứng viên (CANDIDATE)</option>
              </select>
            </div>
          </div>
          <button type="submit" id="create-user-submit-btn" class="btn btn-primary btn-block" style="margin-top: 12px;">
            <span>Lưu tài khoản</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <div id="create-user-result-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="create-user-result-title" aria-describedby="create-user-result-message">
    <section class="modal-card create-user-result-card">
      <div class="modal-body">
        <h3 id="create-user-result-title" class="create-user-result-title"><span aria-hidden="true">✓</span> Tạo tài khoản thành công</h3>
        <p id="create-user-result-message">Tài khoản đã được tạo thành công.</p>
        <div id="create-user-result-credential">
          <p class="form-label">Mật khẩu tạm</p>
          <div class="create-user-result-password-row">
            <code id="create-user-result-password" tabindex="0" aria-label="Mật khẩu tạm"></code>
            <button type="button" id="create-user-result-copy" class="btn btn-outline btn-sm">Copy</button>
          </div>
          <p id="create-user-result-copy-status" role="status" class="create-user-result-copy-status"></p>
        </div>
        <div class="create-user-result-actions">
          <button type="button" id="create-user-result-close" class="btn btn-primary btn-sm">Đóng</button>
        </div>
      </div>
    </section>
  </div>
