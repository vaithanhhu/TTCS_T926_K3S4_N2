<div id="schedule-interview-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="schedule-int-title">
    <div class="modal-card" style="max-width: 580px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header">
        <h3 id="schedule-int-title" class="modal-title">Lên Lịch Phỏng Vấn</h3>
        <button type="button" id="close-schedule-interview-modal" class="modal-close" aria-label="Đóng">&times;</button>
      </div>
      <p class="modal-desc">Thiết lập thời gian, người phỏng vấn và hình thức phỏng vấn cho ứng viên.</p>

      <div class="modal-body" style="overflow-y: auto; padding-right: 4px;">
        <div id="schedule-interview-alert" class="alert-box hidden" role="alert">
          <div class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          </div>
          <div class="alert-content">
            <p id="schedule-interview-alert-msg" style="margin: 0;"></p>
          </div>
        </div>
        <div id="schedule-interview-conflicts" class="alert-box hidden" role="alert" style="display:block;max-height:240px;overflow:auto">
          <strong>Các lịch bị xung đột</strong>
          <div id="schedule-interview-conflict-list"></div>
          <div id="schedule-interview-override-controls" class="hidden" style="margin-top:12px">
            <label for="schedule-interview-override-reason" class="form-label">Lý do ghi đè bắt buộc</label>
            <textarea id="schedule-interview-override-reason" class="form-input" rows="2" maxlength="1000"></textarea>
            <button type="button" id="schedule-interview-override-btn" class="btn btn-danger btn-sm" style="margin-top:8px">Xác nhận lưu lịch bị trùng</button>
          </div>
        </div>

        <form id="schedule-interview-form">
          <div class="form-group">
            <label for="schedule-candidate-select" class="form-label">Chọn ứng viên phỏng vấn <span class="required">*</span></label>
            <select id="schedule-candidate-select" class="form-input" required>
              <option value="">-- Chọn ứng viên trong danh sách --</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label for="schedule-req-select" class="form-label">Vị trí phỏng vấn</label>
              <select id="schedule-req-select" class="form-input">
                <option value="">-- Theo vị trí của ứng viên --</option>
              </select>
            </div>
            <div class="form-group">
              <label for="schedule-interviewer-select" class="form-label">Người phỏng vấn chính <span class="required">*</span></label>
              <select id="schedule-interviewer-select" class="form-input" required>
                <option value="">-- Chọn cán bộ phỏng vấn --</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Cán bộ phỏng vấn phối hợp</label>
            <div id="schedule-additional-interviewers" style="max-height: 90px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: 6px; padding: 6px 10px; background: var(--color-bg-page); display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 0.8rem; color: var(--color-text-muted);">Chọn cán bộ phỏng vấn chính ở trên</span>
            </div>
          </div>

          <div class="form-group">
            <label for="schedule-round-select" class="form-label">Vòng phỏng vấn <span class="required">*</span></label>
            <select id="schedule-round-select" class="form-input" style="margin-bottom: 6px;">
              <option value="Vòng 1 - Kỹ thuật chuyên môn" selected>Vòng 1 - Kỹ thuật chuyên môn</option>
              <option value="Vòng 2 - Phỏng vấn Quản lý / Văn hóa">Vòng 2 - Phỏng vấn Quản lý / Văn hóa</option>
              <option value="Vòng 3 - Phỏng vấn Ban Giám đốc">Vòng 3 - Phỏng vấn Ban Giám đốc</option>
              <option value="Sơ loại hồ sơ / Phỏng vấn nhân sự">Sơ loại hồ sơ / Phỏng vấn nhân sự</option>
              <option value="CUSTOM">-- Vòng phỏng vấn khác (Tự nhập) --</option>
            </select>
            <input type="text" id="schedule-round-name" class="form-input" value="Vòng 1 - Kỹ thuật chuyên môn" placeholder="Nhập tên vòng phỏng vấn" required />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label for="schedule-time" class="form-label">Thời gian phỏng vấn <span class="required">*</span></label>
              <input type="datetime-local" id="schedule-time" class="form-input" required />
            </div>
            <div class="form-group">
              <label for="schedule-duration-select" class="form-label">Thời lượng <span class="required">*</span></label>
              <select id="schedule-duration-select" class="form-input">
                <option value="15">15 phút</option>
                <option value="30">30 phút</option>
                <option value="45">45 phút</option>
                <option value="60" selected>60 phút (Mặc định)</option>
                <option value="90">90 phút</option>
                <option value="120">120 phút (2 giờ)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="schedule-format-select" class="form-label">Hình thức phỏng vấn <span class="required">*</span></label>
            <select id="schedule-format-select" class="form-input">
              <option value="ONLINE" selected>Phỏng vấn trực tuyến (Online)</option>
              <option value="IN_PERSON">Phỏng vấn trực tiếp (Tại văn phòng)</option>
            </select>
          </div>

          <div id="schedule-online-group" class="form-group">
            <label for="schedule-meeting-link" class="form-label">Liên kết họp trực tuyến <span class="required">*</span></label>
            <input type="url" id="schedule-meeting-link" class="form-input" required placeholder="https://meet.google.com/... hoặc link họp" />
          </div>

          <div id="schedule-inperson-group" class="form-group hidden">
            <label for="schedule-meeting-room" class="form-label">Phòng phỏng vấn trực tiếp <span class="required">*</span></label>
            <input type="text" id="schedule-meeting-room" class="form-input" disabled placeholder="Ví dụ: Phòng họp P.302 (Tầng 3)" />
          </div>

          <input type="hidden" id="schedule-location" value="https://meet.google.com/ats-interview" />

          <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" id="cancel-schedule-interview-btn" class="btn btn-outline btn-sm">Hủy bỏ</button>
            <button type="submit" id="submit-schedule-interview-btn" class="btn btn-primary btn-sm">
              <span>Lưu lịch phỏng vấn</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
