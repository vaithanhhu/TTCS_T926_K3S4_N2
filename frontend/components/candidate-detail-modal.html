<div id="candidate-detail-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="cand-detail-title">
    <div class="modal-card" style="max-width: 620px;">
      <div class="modal-header">
        <h3 id="cand-detail-title" class="modal-title">Hồ Sơ Chi Tiết Ứng Viên</h3>
        <button type="button" id="close-candidate-detail-modal" class="modal-close" aria-label="Đóng">&times;</button>
      </div>
      <p class="modal-desc">Thông tin hồ sơ, vị trí ứng tuyển và điều chuyển vòng tuyển dụng.</p>

      <div class="modal-body">
        <div style="display: flex; gap: 16px; align-items: center; background: var(--color-bg-page); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 16px;">
          <div class="user-avatar-circle" style="width: 48px; height: 48px; font-size: 1.25rem;" id="cand-detail-avatar">UV</div>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <h4 id="cand-detail-name" style="margin: 0; font-size: 1.1rem; color: var(--color-text);">Nguyễn Văn An</h4>
              <span id="cand-detail-stage-badge" class="badge badge-primary">Sơ loại CV</span>
            </div>
            <div style="font-size: 0.825rem; color: var(--color-text-secondary); margin-top: 4px;">
              Mã: <code class="font-mono" id="cand-detail-code" style="color: var(--color-primary); font-weight: 600;">UV001</code> | Vị trí: <strong id="cand-detail-req-title">Senior Backend Engineer</strong>
            </div>
            <div style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 2px;">
              Email: <span id="cand-detail-email"></span> | SĐT: <span id="cand-detail-phone"></span>
            </div>
            <div style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 2px;">
              Nguồn ứng viên: <strong id="cand-detail-source">Chưa xác định</strong>
            </div>
          </div>
        </div>

        <input type="hidden" id="cand-detail-id" />

        <!-- Giai đoạn tuyển dụng form -->
        <div class="panel-card" style="padding: 14px; margin-bottom: 14px;">
          <div style="font-weight: 600; font-size: 0.875rem; margin-bottom: 10px; color: var(--color-text); display: flex; justify-content: space-between;">
            <span>Chuyển vòng tuyển dụng (Pipeline Stage)</span>
            <span id="cand-detail-rating" style="color: #f59e0b;">★★★★☆</span>
          </div>
          <div style="display: flex; gap: 10px; align-items: center;">
            <select id="cand-detail-change-stage-select" class="form-input" style="flex: 1;">
              <option value="APPLIED">Ứng tuyển mới (APPLIED)</option>
              <option value="SCREENING">Sơ loại hồ sơ (SCREENING)</option>
              <option value="INTERVIEW">Phỏng vấn (INTERVIEW)</option>
              <option value="OFFER">Đề nghị nhận việc (OFFER)</option>
              <option value="HIRED">Đã tuyển dụng (HIRED)</option>
              <option value="REJECTED">Từ chối hồ sơ (REJECTED)</option>
            </select>
            <button type="button" id="cand-detail-save-stage-btn" class="btn btn-primary btn-sm">
              <span>Lưu vòng mới</span>
            </button>
          </div>
          <div id="cand-detail-rejection-reason-group" class="form-group hidden" style="margin-top: 10px; margin-bottom: 0;">
            <label for="cand-detail-rejection-reason-select" class="form-label">
              Lý do loại hồ sơ
            </label>
            <select id="cand-detail-rejection-reason-select" class="form-input">
              <option value="">-- Chọn lý do loại --</option>
            </select>
          </div>
        </div>

        <!-- Quick Action Shortcuts -->
        <div style="display: flex; gap: 10px; justify-content: space-between; border-top: 1px solid var(--color-border); padding-top: 14px;">
          <button type="button" id="cand-detail-schedule-btn" class="btn btn-outline btn-sm" style="flex: 1;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>Lên lịch Phỏng vấn</span>
          </button>
          <button type="button" id="cand-detail-offer-btn" class="btn btn-outline btn-sm" style="flex: 1;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            <span>Tạo bản đề xuất Offer</span>
          </button>
        </div>
      </div>
    </div>
  </div>
