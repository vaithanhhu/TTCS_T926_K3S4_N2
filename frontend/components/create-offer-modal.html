<div id="create-offer-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="create-off-title">
    <div class="modal-card" style="max-width: 580px;">
      <div class="modal-header">
        <h3 id="create-off-title" class="modal-title">Lập Thư Mời Nhận Việc (Offer)</h3>
        <button type="button" id="close-create-offer-modal" class="modal-close" aria-label="Đóng">&times;</button>
      </div>
      <p class="modal-desc">Soạn thảo văn bản đề xuất mức lương, ngày nhận việc và chế độ đãi ngộ.</p>

      <div class="modal-body">
        <div id="create-offer-alert" class="alert-box hidden" role="alert">
          <div class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          </div>
          <div class="alert-content">
            <p id="create-offer-alert-msg" style="margin: 0;"></p>
          </div>
        </div>

        <form id="create-offer-form">
          <div class="form-group">
            <label for="create-offer-cand-select" class="form-label">Chọn ứng viên tiếp nhận <span class="required">*</span></label>
            <select id="create-offer-cand-select" class="form-input" required>
              <option value="">-- Chọn ứng viên --</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label for="create-offer-req-select" class="form-label">Vị trí tuyển dụng</label>
              <select id="create-offer-req-select" class="form-input">
                <option value="">-- Theo vị trí tuyển dụng --</option>
              </select>
            </div>
            <div class="form-group">
              <label for="create-offer-salary" class="form-label">Mức lương hàng tháng (VNĐ) <span class="required">*</span></label>
              <input type="number" id="create-offer-salary" class="form-input" placeholder="25000000" min="1000000" step="500000" required />
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label for="create-offer-start-date" class="form-label">Ngày dự kiến nhận việc</label>
              <input type="date" id="create-offer-start-date" class="form-input" />
            </div>
            <div class="form-group">
              <label for="create-offer-approver-select" class="form-label">Cấp quản lý phê duyệt</label>
              <select id="create-offer-approver-select" class="form-input">
                <option value="">-- Chọn người phê duyệt --</option>
              </select>
            </div>
          </div>

          <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" id="cancel-create-offer-btn" class="btn btn-outline btn-sm">Hủy bỏ</button>
            <button type="submit" id="submit-create-offer-btn" class="btn btn-primary btn-sm">
              <span>Lưu & Chuyển phê duyệt</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
