<div id="requisitions-view" class="hidden">
          <div class="view-header">
            <div class="view-title-group">
              <div style="display: flex; align-items: center; gap: 8px;">
                <h2>Yêu cầu & Vị trí Tuyển dụng</h2>
                <span id="requisitions-total-badge" class="badge badge-primary font-mono">0 vị trí</span>
              </div>
              <p>Quản lý các đợt tuyển dụng, phân công recruiter và tiến độ bàn giao công việc</p>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="open-create-req-modal-btn" class="btn btn-primary btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span> Khởi tạo Vị trí Tuyển dụng</span>
              </button>
            </div>
          </div>

          <!-- Toolbar -->
          <div class="filter-toolbar">
            <div class="toolbar-filters">
              <div style="min-width: 260px; flex: 1;">
                <input type="text" id="req-search-input" class="form-input" placeholder="Tìm theo tiêu đề, mã vị trí, phòng ban..." />
              </div>
              <div style="width: 180px;">
                <select id="req-status-filter" class="form-input">
                  <option value="ALL">Tất cả trạng thái</option>
                  <option value="DRAFT">Nháp (DRAFT)</option>
                  <option value="OPEN">Đang mở (OPEN)</option>
                  <option value="IN_PROGRESS">Đang tuyển (IN_PROGRESS)</option>
                  <option value="CLOSED">Đã đóng (CLOSED)</option>
                </select>
              </div>
              <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.825rem; color: var(--color-warning); cursor: pointer; padding: 0 4px;">
                <input type="checkbox" id="req-handover-only" style="accent-color: var(--color-warning); cursor: pointer;" />
                <span>Chỉ hiện vị trí cần bàn giao</span>
              </label>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="req-export-btn" class="btn btn-outline btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>Xuất Excel</span>
              </button>
              <button type="button" id="req-refresh-btn" class="btn btn-outline btn-sm">
                Lọc / Làm mới
              </button>
            </div>
          </div>

          <!-- Table -->
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mã vị trí</th>
                  <th>Tiêu đề tuyển dụng</th>
                  <th>Phòng ban</th>
                  <th style="text-align: center;">Chỉ tiêu</th>
                  <th>Recruiter phụ trách</th>
                  <th>Trạng thái</th>
                  <th style="text-align: center;">Thao tác</th>
                </tr>
              </thead>
              <tbody id="requisitions-table-body">
                <!-- Injected by JS -->
              </tbody>
            </table>
          </div>
        </div>
