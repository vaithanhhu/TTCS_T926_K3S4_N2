<div id="interviews-view" class="hidden">
  <div class="view-header">
    <div class="view-title-group">
      <div style="display: flex; align-items: center; gap: 8px;">
        <h2>Lịch Phỏng vấn</h2>
        <span id="interviews-total-badge" class="badge badge-primary font-mono">0 phiên</span>
      </div>
      <p>Theo dõi các buổi phỏng vấn, người phỏng vấn phụ trách và kết quả đánh giá năng lực</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button type="button" id="open-create-interview-modal-btn" class="btn btn-primary btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span> Lên lịch Phỏng vấn</span>
      </button>
    </div>
  </div>

  <div class="filter-toolbar" style="flex-wrap: wrap; gap: 12px;">
    <div style="display: flex; gap: 8px; align-items: center;">
      <div class="tab-group" id="interviews-scope-tabs" style="display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-bg-secondary);">
        <button type="button" class="tab-btn active" data-scope="mine" id="tab-scope-mine" style="padding: 6px 14px; border: none; background: var(--color-primary); color: #fff; font-size: 0.85rem; font-weight: 500; cursor: pointer;">Lịch của tôi</button>
        <button type="button" class="tab-btn" data-scope="all" id="tab-scope-all" style="padding: 6px 14px; border: none; background: transparent; color: var(--color-text-muted); font-size: 0.85rem; font-weight: 500; cursor: pointer;">Tất cả</button>
      </div>
    </div>
    <div class="toolbar-filters" style="flex: 1; display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="min-width: 200px; flex: 1;">
        <input type="text" id="interviews-search-input" class="form-input" placeholder="Tìm theo ứng viên, vị trí tuyển dụng..." />
      </div>
      <div style="width: 140px;">
        <select id="interviews-timeframe-filter" class="form-input">
          <option value="UPCOMING">Sắp tới</option>
          <option value="ALL">Tất cả thời gian</option>
          <option value="PAST">Đã qua</option>
        </select>
      </div>
      <div style="width: 150px;">
        <select id="interviews-status-filter" class="form-input">
          <option value="ALL">Tất cả trạng thái</option>
          <option value="SCHEDULED">Đã lên lịch</option>
          <option value="COMPLETED">Đã hoàn thành</option>
          <option value="CANCELLED">Đã hủy</option>
        </select>
      </div>
      <div style="width: 160px;">
        <select id="interviews-eval-filter" class="form-input">
          <option value="ALL">Tất cả đánh giá</option>
          <option value="NOT_SUBMITTED">Chưa nộp đánh giá</option>
          <option value="SUBMITTED">Đã nộp đánh giá</option>
        </select>
      </div>
    </div>
    <div>
      <button type="button" id="interviews-refresh-btn" class="btn btn-outline btn-sm">
        Lọc / Làm mới
      </button>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Mã PV</th>
          <th>Ứng viên & CV</th>
          <th>Vị trí</th>
          <th>Người phỏng vấn</th>
          <th>Thời gian</th>
          <th>Hình thức / Địa điểm</th>
          <th>Trạng thái & Đánh giá</th>
          <th style="text-align: center;">Thao tác</th>
        </tr>
      </thead>
      <tbody id="interviews-table-body">
      </tbody>
    </table>
  </div>
</div>
